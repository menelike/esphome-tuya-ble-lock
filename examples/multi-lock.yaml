# Example: TWO Tuya ZX-5330/-5377 locks driven by ONE ESP32.
# Both locks must be within BLE range of this ESP (keep it close to them — see README).
# Replace all <PLACEHOLDER> values with each lock's own credentials.

esphome:
  name: tuya-locks
  friendly_name: Tuya Locks

external_components:
  - source:
      type: git
      url: https://github.com/menelike/esphome-tuya-ble-lock
    components: [tuya_lock]
    # ref: v1.0.0   # optional: pin to a release for a reproducible build

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "<YOUR_API_ENCRYPTION_KEY>"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tuya Locks Fallback"
    password: "<AP_PASSWORD>"

captive_portal:

esp32_ble_tracker:

ble_client:
  - mac_address: <FRONT_MAC>
    id: front_client
  - mac_address: <BACK_MAC>
    id: back_client

tuya_lock:
  - id: front
    ble_client_id: front_client
    local_key: "<FRONT_LOCAL_KEY_V2>"
    uuid: "<FRONT_UUID>"
    device_id: "<FRONT_DEVICE_ID>"
    passcode: "<FRONT_PASSCODE>"
    on_success:
      - logger.log: "front action ok"
    on_error:
      - logger.log: "front action FAILED"
  - id: back
    ble_client_id: back_client
    local_key: "<BACK_LOCAL_KEY_V2>"
    uuid: "<BACK_UUID>"
    device_id: "<BACK_DEVICE_ID>"
    passcode: "<BACK_PASSCODE>"

button:
  - platform: tuya_lock
    action: unlock
    tuya_lock_id: front
    name: "Front Door Unlock"
  - platform: tuya_lock
    action: lock
    tuya_lock_id: front
    name: "Front Door Lock"
  - platform: tuya_lock
    action: unlock
    tuya_lock_id: back
    name: "Back Door Unlock"
  - platform: tuya_lock
    action: lock
    tuya_lock_id: back
    name: "Back Door Lock"
