# Example ESPHome config for a Tuya ZX-5330/-5377 BLE smart lock.
# Replace ALL <PLACEHOLDER> values with your own (see README: "Getting your credentials").
# Flash this onto an ESP32 (any BLE-capable ESP32: classic / C3 / S3 / C6) placed
# within Bluetooth range of the lock.

esphome:
  name: tuya-lock
  friendly_name: Tuya Lock

# Pull the tuya_lock component straight from GitHub — no local files needed.
external_components:
  - source:
      type: git
      url: https://github.com/menelike/esphome-tuya-ble-lock
    components: [tuya_lock]
    # Recommended: pin a released version so a future update can't break your build:
    # ref: v1.0.0
  # Alternatively, if you cloned the repo next to your config, use a local source:
  # - source: { type: local, path: esphome-tuya-ble-lock/components }
  #   components: [tuya_lock]

esp32:
  variant: esp32c3          # or: board: esp32dev  (classic ESP32), etc.
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "<YOUR_API_ENCRYPTION_KEY>"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # SECURITY: no fallback `ap:` and no `captive_portal:` below (see README "Security").
  # This device can open your doors — you do NOT want it exposing an open/soft-AP config
  # portal if it can't reach WiFi (e.g. someone cuts your router's power). Leaving these out
  # means a WiFi outage just makes the lock buttons temporarily unavailable, which is the
  # safe failure mode. Re-flash over USB if you ever need to change WiFi.

esp32_ble_tracker:
  scan_parameters:
    # The lock is a sleepy, battery-powered peripheral that advertises infrequently. The
    # tracker default listens only 30ms out of every 320ms (~9% of the time), so it can miss
    # the lock's advertisement for several seconds — making the first on-demand connect time
    # out. Listen almost continuously so the advertisement is caught right away.
    interval: 320ms
    window: 300ms
    active: true

# ---- one ble_client + one tuya_lock + buttons PER lock ----
ble_client:
  - mac_address: <LOCK_MAC>            # e.g. AA:BB:CC:11:22:33
    id: my_lock_client

tuya_lock:
  - id: my_lock
    ble_client_id: my_lock_client
    local_key: "<LOCAL_KEY_V2>"        # the v2.0 local_key — see README
    uuid: "<UUID>"
    device_id: "<DEVICE_ID>"
    passcode: "<PASSCODE>"             # numeric door passcode — see README
    # status_on_boot defaults to true: a few seconds after boot the component reads status once,
    # which warms the BLE path (so your first button press connects fast) and fills the
    # battery/last-status entities. Uncomment to disable and go strictly on-demand:
    # status_on_boot: false

button:
  - platform: tuya_lock
    action: unlock
    tuya_lock_id: my_lock
    name: "Front Door Unlock"
  - platform: tuya_lock
    action: lock
    tuya_lock_id: my_lock
    name: "Front Door Lock"
  - platform: tuya_lock
    action: status
    tuya_lock_id: my_lock
    name: "Front Door Status"   # press to refresh battery + get a "last status" row

# Optional battery sensor — updates on each status read (and whenever the lock
# reports its battery). If your device already has a `sensor:` block, add this entry
# INTO that block rather than declaring `sensor:` twice (YAML forbids duplicate keys).
sensor:
  - platform: tuya_lock
    tuya_lock_id: my_lock
    battery_level:
      name: "Front Door Battery"

# Optional "last status" text sensor — a readable summary published on each status read,
# e.g. "battery 70% · @342s" (the @Ns suffix is the ESP uptime, added so the value differs
# on every press). Because its state changes each press, it gives you a
# visible confirmation line in Home Assistant's logbook / device activity that the lock
# was reached (the battery % alone only changes when the level actually changes).
# Same rule as above: if you already have a `text_sensor:` block, merge this entry in.
text_sensor:
  - platform: tuya_lock
    tuya_lock_id: my_lock
    last_status:
      name: "Front Door Last Status"
